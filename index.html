<!DOCTYPE html>
<html lang="ja" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>リアルタイム車両運行管理システム</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    },
                    fontFamily: {
                        sans: ['"BIZ UDGothic"', '"Hiragino Kaku Gothic ProN"', 'Meiryo', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- Google Fonts & Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    
    <!-- Leaflet JS & CSS for Maps -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        .vehicle-marker {
            transition: all 0.5s ease-out;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="h-full bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-sans transition-colors duration-200">
    <div id="app" class="flex flex-col h-full w-full overflow-hidden">
        
        <!-- Header Nav -->
        <header class="h-14 bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between px-4 z-20 shrink-0 shadow-sm">
            <div class="flex items-center gap-2">
                <span class="material-symbols-outlined text-brand-600 text-2xl">local_shipping</span>
                <h1 class="font-bold text-base tracking-wide">FleetTracker</h1>
            </div>

            <!-- View Switcher -->
            <div class="flex items-center gap-2">
                <div class="bg-slate-100 dark:bg-slate-700 p-1 rounded-xl flex items-center text-xs font-semibold">
                    <button id="nav-map" onclick="switchTab('map')" class="px-3 py-1.5 rounded-lg transition-all shadow-sm bg-white dark:bg-slate-800 text-brand-600 dark:text-brand-100">地図</button>
                    <button id="nav-send" onclick="switchTab('send')" class="px-3 py-1.5 rounded-lg transition-all text-slate-600 dark:text-slate-300 hover:text-slate-900">送信</button>
                    <button id="nav-admin" onclick="switchTab('admin')" class="px-3 py-1.5 rounded-lg transition-all text-slate-600 dark:text-slate-300 hover:text-slate-900">管理</button>
                </div>

                <button onclick="toggleTheme()" class="p-2 rounded-xl text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-700 transition">
                    <span class="material-symbols-outlined text-xl" id="theme-icon">dark_mode</span>
                </button>
            </div>
        </header>

        <!-- TAB 1: 地図 (MAP VIEW) -->
        <main id="tab-map" class="flex-1 flex flex-col md:flex-row overflow-hidden relative">
            <!-- Sidebar / Mobile Drawer -->
            <aside id="map-sidebar" class="w-full md:w-80 bg-white dark:bg-slate-800 border-r border-slate-200 dark:border-slate-700 flex flex-col z-10 shadow-md max-h-48 md:max-h-none overflow-y-auto">
                <div class="p-3 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between sticky top-0 bg-white dark:bg-slate-800 z-10">
                    <h2 class="font-bold text-sm">車両一覧</h2>
                    <span id="sync-status-badge" class="text-[10px] px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700 dark:bg-emerald-950 dark:text-emerald-300 font-bold">同期完了</span>
                </div>
                <div id="vehicle-list" class="p-2 space-y-2 flex-1"></div>
            </aside>

            <!-- Map Area -->
            <div class="flex-1 relative h-full w-full overflow-hidden">
                <div id="map" class="h-full w-full z-0 cursor-pointer"></div>

                <!-- Recenter Floating Action Button -->
                <button onclick="recenterMap()" class="absolute bottom-20 right-4 z-20 bg-white dark:bg-slate-800 p-3 rounded-full shadow-lg border border-slate-200 dark:border-slate-700 text-brand-600 dark:text-brand-400 active:scale-95 transition" title="現在地に復帰">
                    <span class="material-symbols-outlined text-xl">my_location</span>
                </button>

                <!-- Show Timeline Bar FAB (when hidden) -->
                <button id="btn-show-timeline" onclick="toggleTimelineVisibility(true)" class="absolute bottom-4 right-4 z-20 bg-white dark:bg-slate-800 p-3 rounded-full shadow-lg border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hidden hover:text-brand-600 transition" title="タイムラインを表示">
                    <span class="material-symbols-outlined text-xl">history</span>
                </button>

                <!-- Timeline Bar Overlay -->
                <div id="timeline-overlay" class="absolute bottom-4 left-4 right-4 md:left-12 md:right-12 z-10 bg-white/95 dark:bg-slate-800/95 backdrop-blur-md p-3 rounded-2xl shadow-xl border border-slate-200/60 dark:border-slate-700/60 transition-all duration-300 transform translate-y-0">
                    <div class="flex items-center justify-between text-xs mb-1">
                        <span class="font-bold flex items-center gap-1">
                            <span class="material-symbols-outlined text-sm text-brand-600">history</span>
                            再生バー
                        </span>
                        <div class="flex items-center gap-2">
                            <span id="timeline-time" class="text-slate-500 font-mono text-[11px]">ライブ表示中</span>
                            <button onclick="toggleTimelineVisibility(false)" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200" title="たたむ">
                                <span class="material-symbols-outlined text-base">expand_more</span>
                            </button>
                        </div>
                    </div>
                    <input type="range" id="timeline-slider" min="0" max="100" value="100" class="w-full accent-brand-600 cursor-pointer" oninput="handleTimelineChange(this.value)">
                    <div class="flex items-center justify-between mt-2">
                        <button id="btn-play-timeline" onclick="togglePlayback()" class="flex items-center gap-1 text-xs px-3 py-1 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 rounded-lg transition">
                            <span class="material-symbols-outlined text-sm" id="play-icon">play_arrow</span>
                            <span id="play-btn-text">再生</span>
                        </button>
                        <button onclick="resetTimeline()" class="text-xs text-brand-600 dark:text-brand-400 hover:underline">ライブ表示に戻る</button>
                    </div>
                </div>
            </div>
        </main>

        <!-- TAB 2: 送信 (MOBILE TRANSMITTER VIEW) -->
        <main id="tab-send" class="flex-1 flex flex-col p-4 bg-slate-100 dark:bg-slate-900 overflow-y-auto hidden">
            <div class="max-w-md w-full mx-auto space-y-4 my-auto">
                <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 space-y-3">
                    <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase">担当車両を選択</label>
                    <select id="send-vehicle-select" onchange="onSendVehicleChange()" class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-xl px-4 py-3 text-base font-bold focus:ring-2 focus:ring-brand-500 focus:outline-none"></select>
                </div>

                <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 text-center space-y-4">
                    <div class="inline-flex items-center justify-center p-3 rounded-full bg-brand-50 dark:bg-slate-700 text-brand-600 dark:text-brand-400 mb-1">
                        <span class="material-symbols-outlined text-4xl">navigation</span>
                    </div>
                    <div>
                        <div id="mobile-speed" class="text-5xl font-extrabold tracking-tight font-mono">0.0</div>
                        <div class="text-xs text-slate-500 font-semibold mt-1">時速 (km/h)</div>
                    </div>
                    <div class="grid grid-cols-2 gap-2 pt-4 border-t border-slate-100 dark:border-slate-700 text-left">
                        <div class="bg-slate-50 dark:bg-slate-700/50 p-3 rounded-xl">
                            <span class="text-[10px] text-slate-400 block font-bold">方角</span>
                            <span id="mobile-heading" class="text-sm font-bold font-mono">0°</span>
                        </div>
                        <div class="bg-slate-50 dark:bg-slate-700/50 p-3 rounded-xl">
                            <span class="text-[10px] text-slate-400 block font-bold">GPS精度</span>
                            <span id="mobile-accuracy" class="text-sm font-bold font-mono">-- m</span>
                        </div>
                    </div>
                    <div class="text-xs text-slate-400 font-mono text-right" id="mobile-last-send">最終送信: 未送信</div>
                </div>

                <button id="btn-toggle-tracking" onclick="toggleTracking()" class="w-full py-4 rounded-2xl font-bold text-lg text-white shadow-lg transition-all duration-200 flex items-center justify-center gap-2 bg-emerald-600 hover:bg-emerald-700 active:scale-95">
                    <span class="material-symbols-outlined text-2xl">sensors</span>
                    <span>位置情報の送信を開始</span>
                </button>
            </div>
        </main>

        <!-- TAB 3: 管理 (ADMIN VIEW) -->
        <main id="tab-admin" class="flex-1 flex flex-col p-4 bg-slate-100 dark:bg-slate-900 overflow-y-auto hidden">
            <div class="max-w-2xl w-full mx-auto space-y-6">
                
                <!-- Auth Block -->
                <div id="admin-auth-card" class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 text-center space-y-4">
                    <span class="material-symbols-outlined text-4xl text-brand-600">lock</span>
                    <h2 class="font-bold text-lg">管理者認証</h2>
                    <input type="password" id="admin-pass-input" placeholder="パスワードを入力" class="w-full px-4 py-3 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-700 text-center text-sm font-bold">
                    <button onclick="loginAdmin()" class="w-full py-3 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-xl shadow transition">ログイン</button>
                </div>

                <!-- Admin Main Content (Protected) -->
                <div id="admin-content" class="space-y-6 hidden">
                    <!-- Manage Vehicles -->
                    <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 space-y-4">
                        <div class="flex items-center justify-between">
                            <div>
                                <h3 class="font-bold text-base">車両管理</h3>
                                <p class="text-xs text-slate-500">車両の追加・編集・削除を行えます</p>
                            </div>
                            <button onclick="openVehicleModal()" class="flex items-center gap-1 text-xs bg-brand-600 hover:bg-brand-700 text-white font-semibold px-3 py-2 rounded-lg transition shadow-sm">
                                <span class="material-symbols-outlined text-sm">add</span> 車両追加
                            </button>
                        </div>
                        <div id="admin-vehicle-list" class="divide-y divide-slate-100 dark:divide-slate-700"></div>
                    </div>

                    <!-- Config & Password Edit -->
                    <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 space-y-4">
                        <h3 class="font-bold text-base border-b border-slate-100 dark:border-slate-700 pb-2">GitHub / システム設定</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1">GitHub ユーザー名</label>
                                <input type="text" id="cfg-owner" placeholder="goshun6980" class="w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-700 text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1">リポジトリ名</label>
                                <input type="text" id="cfg-repo" placeholder="cartracking2" class="w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-700 text-sm">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1">Personal Access Token (PAT)</label>
                            <input type="password" id="cfg-token" placeholder="ghp_xxxxxxxxxxxx" class="w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-700 text-sm font-mono">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1">管理者パスワードの変更</label>
                            <input type="password" id="cfg-admin-pass" placeholder="新しいパスワード (空白で変更なし)" class="w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-700 text-sm">
                        </div>
                        <button onclick="saveAdminConfig()" class="w-full py-3 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-xl transition shadow">設定およびパスワードを保存</button>

                        <!-- Generated Auto-Setup URL Card -->
                        <div id="url-generator-card" class="mt-4 p-4 bg-slate-50 dark:bg-slate-700/50 rounded-xl border border-slate-200 dark:border-slate-600 space-y-2 hidden">
                            <label class="block text-xs font-bold text-slate-600 dark:text-slate-300">スマホ登録用 自動設定URL</label>
                            <input type="text" id="generated-url-input" readonly class="w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-xs font-mono select-all">
                            <button onclick="copyGeneratedUrl()" class="w-full py-2 bg-slate-800 hover:bg-slate-900 text-white dark:bg-slate-200 dark:text-slate-900 font-bold text-xs rounded-lg transition flex items-center justify-center gap-1">
                                <span class="material-symbols-outlined text-sm">content_copy</span> URLをコピー
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- VEHICLE ADD / EDIT MODAL -->
    <div id="modal-vehicle" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm hidden">
        <div class="bg-white dark:bg-slate-800 w-full max-w-md rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-700 overflow-hidden flex flex-col">
            <div class="px-6 py-4 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between">
                <h3 id="modal-vehicle-title" class="font-bold text-base">車両編集</h3>
                <button onclick="closeVehicleModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>

            <form id="form-vehicle" onsubmit="saveVehicle(event)" class="p-6 space-y-4">
                <input type="hidden" id="edit-vehicle-original-id">

                <div>
                    <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1">車両ID *</label>
                    <input type="text" id="input-vehicle-id" required placeholder="例: CAR-001" class="w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1">表示名 (車両名) *</label>
                    <input type="text" id="input-vehicle-name" required placeholder="例: 1号車" class="w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-sm">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1">乗員名</label>
                        <input type="text" id="input-vehicle-driver" placeholder="例: 山田" class="w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1">カラー</label>
                        <input type="color" id="input-vehicle-color" value="#4f46e5" class="w-full h-9 rounded cursor-pointer border-0 bg-transparent">
                    </div>
                </div>

                <div class="pt-4 flex items-center justify-between border-t border-slate-100 dark:border-slate-700">
                    <button type="button" id="btn-delete-vehicle" onclick="deleteVehicle()" class="text-xs text-red-600 font-bold flex items-center gap-1 hidden">
                        <span class="material-symbols-outlined text-sm">delete</span> 削除
                    </button>
                    <div class="flex gap-2 ml-auto">
                        <button type="button" onclick="closeVehicleModal()" class="px-4 py-2 text-xs font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg">キャンセル</button>
                        <button type="submit" class="px-4 py-2 text-xs font-semibold bg-brand-600 hover:bg-brand-700 text-white rounded-lg transition shadow-sm">保存</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- MAIN JAVASCRIPT LOGIC -->
    <script>
        const INITIAL_VEHICLES = {
            "CAR-001": { id: "CAR-001", name: "1号車", driver: "山田 太郎", color: "#4f46e5", icon: "directions_car", lat: 35.1709, lng: 136.9076, speed: 0, heading: 0, online: true, lastUpdated: new Date().toISOString() }
        };

        let state = {
            tab: 'map',
            vehicles: {},
            selectedVehicleId: 'CAR-001',
            config: { owner: 'goshun6980', repo: 'cartracking2', token: '' },
            adminPassword: 'admin',
            isAdminLoggedIn: false,
            isTracking: false,
            watchPositionId: null,
            map: null,
            markers: {},
            timelineVisible: true
        };

        window.addEventListener('DOMContentLoaded', async () => {
            initTheme();
            loadConfigFromStorage();
            parseUrlParamsAutoConfig();
            await fetchConfigJson(); // Load password from config.json
            loadVehiclesLocal();
            initMap();
            renderVehicleList();
            
            // Map click listener to toggle timeline visibility
            if (state.map) {
                state.map.on('click', () => {
                    toggleTimelineVisibility(!state.timelineVisible);
                });
            }

            // Sync with GitHub every 8 seconds
            setInterval(() => {
                if (state.tab === 'map') fetchCurrentDataFromGitHub();
            }, 8000);
        });

        // --- Theme ---
        function initTheme() {
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                document.getElementById('theme-icon').textContent = 'light_mode';
            }
        }
        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.theme = isDark ? 'dark' : 'light';
            document.getElementById('theme-icon').textContent = isDark ? 'light_mode' : 'dark_mode';
        }

        // --- Navigation ---
        function switchTab(tab) {
            state.tab = tab;
            ['map', 'send', 'admin'].forEach(t => {
                const el = document.getElementById(`tab-${t}`);
                const btn = document.getElementById(`nav-${t}`);
                if (t === tab) {
                    el.classList.remove('hidden');
                    btn.className = "px-3 py-1.5 rounded-lg transition-all shadow-sm bg-white dark:bg-slate-800 text-brand-600 dark:text-brand-100";
                } else {
                    el.classList.add('hidden');
                    btn.className = "px-3 py-1.5 rounded-lg transition-all text-slate-600 dark:text-slate-300 hover:text-slate-900";
                }
            });
            if (tab === 'map' && state.map) {
                setTimeout(() => state.map.invalidateSize(), 100);
            }
            if (tab === 'send') updateSendDropdown();
        }

        // --- Config & Auto-Param Parsing ---
        function loadConfigFromStorage() {
            const cfg = localStorage.getItem('fleet_config');
            if (cfg) {
                try { state.config = JSON.parse(cfg); } catch(e){}
            }
            document.getElementById('cfg-owner').value = state.config.owner || '';
            document.getElementById('cfg-repo').value = state.config.repo || '';
            document.getElementById('cfg-token').value = state.config.token || '';
            updateGeneratedUrlCard();
        }

        function parseUrlParamsAutoConfig() {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            const user = urlParams.get('user');
            const repo = urlParams.get('repo');

            if (token || user || repo) {
                if (token) state.config.token = token;
                if (user) state.config.owner = user;
                if (repo) state.config.repo = repo;

                localStorage.setItem('fleet_config', JSON.stringify(state.config));
                loadConfigFromStorage();
                window.history.replaceState({}, document.title, window.location.pathname);
                alert("URLからのパラメータ自動設定が完了しました！");
            }
        }

        async function fetchConfigJson() {
            const { owner, repo } = state.config;
            if (!owner || !repo) return;
            try {
                const res = await fetch(`https://raw.githubusercontent.com/${owner}/${repo}/main/data/config.json?t=${Date.now()}`);
                if (res.ok) {
                    const json = await res.json();
                    if (json.adminPassword) state.adminPassword = json.adminPassword;
                }
            } catch(e){}
        }

        // --- Data Loading & GitHub Sync ---
        function loadVehiclesLocal() {
            const cached = localStorage.getItem('fleet_vehicles');
            if (cached) {
                try { state.vehicles = JSON.parse(cached); } catch(e) { state.vehicles = INITIAL_VEHICLES; }
            } else {
                state.vehicles = INITIAL_VEHICLES;
                saveVehiclesLocal();
            }
        }

        function saveVehiclesLocal() {
            localStorage.setItem('fleet_vehicles', JSON.stringify(state.vehicles));
        }

        async function fetchCurrentDataFromGitHub() {
            const { owner, repo } = state.config;
            if (!owner || !repo) return;
            try {
                const res = await fetch(`https://raw.githubusercontent.com/${owner}/${repo}/main/data/current.json?t=${Date.now()}`);
                if (res.ok) {
                    const json = await res.json();
                    if (json.vehicles) {
                        state.vehicles = json.vehicles;
                        saveVehiclesLocal();
                        renderVehicleList();
                        updateMapMarkers();
                        updateSyncBadge("同期完了", "emerald");
                    }
                }
            } catch(e) {
                updateSyncBadge("通信エラー", "red");
            }
        }

        async function pushCurrentToGitHub() {
            const { owner, repo, token } = state.config;
            if (!owner || !repo || !token) return;

            updateSyncBadge("GitHubへ保存中...", "blue");
            const path = `data/current.json`;
            const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;

            try {
                let sha = "";
                const getRes = await fetch(url, { headers: { 'Authorization': `token ${token}` } });
                if (getRes.ok) {
                    const fileInfo = await getRes.json();
                    sha = fileInfo.sha;
                }

                const contentEncoded = btoa(unescape(encodeURIComponent(JSON.stringify({ vehicles: state.vehicles }, null, 2))));
                const putRes = await fetch(url, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: `Update vehicles via FleetTracker`, content: contentEncoded, sha: sha || undefined })
                });

                if (putRes.ok) {
                    updateSyncBadge("同期完了", "emerald");
                } else {
                    updateSyncBadge("保存失敗", "red");
                }
            } catch(e) {
                updateSyncBadge("保存エラー", "red");
            }
        }

        async function appendHistoryLogToGitHub(vehicleId, lat, lng, speed, heading) {
            const { owner, repo, token } = state.config;
            if (!owner || !repo || !token) return;

            const path = `data/history.json`;
            const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;

            try {
                let sha = "";
                let logs = [];
                const getRes = await fetch(url, { headers: { 'Authorization': `token ${token}` } });
                if (getRes.ok) {
                    const fileInfo = await getRes.json();
                    sha = fileInfo.sha;
                    const decoded = decodeURIComponent(escape(atob(fileInfo.content)));
                    const parsed = JSON.parse(decoded);
                    logs = parsed.logs || [];
                }

                logs.push({
                    vehicleId, lat, lng, speed, heading, timestamp: new Date().toISOString()
                });

                const contentEncoded = btoa(unescape(encodeURIComponent(JSON.stringify({ logs }, null, 2))));
                await fetch(url, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: `Append history log for ${vehicleId}`, content: contentEncoded, sha: sha || undefined })
                });
            } catch(e){}
        }

        function updateSyncBadge(text, color) {
            const badge = document.getElementById('sync-status-badge');
            if (badge) {
                badge.textContent = text;
                badge.className = `text-[10px] px-2 py-0.5 rounded-full font-bold bg-${color}-100 text-${color}-700 dark:bg-${color}-950 dark:text-${color}-300`;
            }
        }

        // --- Map Logic ---
        function initMap() {
            state.map = L.map('map').setView([35.1709, 136.9076], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap'
            }).addTo(state.map);
            updateMapMarkers();
        }

        function updateMapMarkers() {
            if (!state.map) return;
            Object.values(state.vehicles).forEach(v => {
                if (!v.lat || !v.lng) return;
                const markerHtml = `
                    <div style="background-color: ${v.color || '#4f46e5'}; transform: rotate(${v.heading || 0}deg);" 
                         class="vehicle-marker w-9 h-9 rounded-full flex items-center justify-center text-white shadow-lg border-2 border-white dark:border-slate-800">
                        <span class="material-symbols-outlined text-lg">${v.icon || 'directions_car'}</span>
                    </div>
                `;
                const icon = L.divIcon({ html: markerHtml, className: '', iconSize: [36, 36], iconAnchor: [18, 18] });
                if (state.markers[v.id]) {
                    state.markers[v.id].setLatLng([v.lat, v.lng]);
                    state.markers[v.id].setIcon(icon);
                } else {
                    const marker = L.marker([v.lat, v.lng], { icon }).addTo(state.map);
                    state.markers[v.id] = marker;
                }
            });
        }

        function recenterMap() {
            const v = state.vehicles[state.selectedVehicleId];
            if (v && v.lat && v.lng && state.map) {
                state.map.panTo([v.lat, v.lng]);
            }
        }

        function toggleTimelineVisibility(show) {
            state.timelineVisible = show;
            const overlay = document.getElementById('timeline-overlay');
            const showBtn = document.getElementById('btn-show-timeline');
            if (show) {
                overlay.classList.remove('translate-y-32', 'opacity-0', 'pointer-events-none');
                showBtn.classList.add('hidden');
            } else {
                overlay.classList.add('translate-y-32', 'opacity-0', 'pointer-events-none');
                showBtn.classList.remove('hidden');
            }
        }

        // --- Render Side List ---
        function renderVehicleList() {
            const container = document.getElementById('vehicle-list');
            const adminContainer = document.getElementById('admin-vehicle-list');
            container.innerHTML = '';
            if (adminContainer) adminContainer.innerHTML = '';

            Object.values(state.vehicles).forEach(v => {
                // Map List Item
                const item = document.createElement('div');
                item.className = `p-2.5 rounded-xl border transition cursor-pointer flex items-center justify-between ${v.id === state.selectedVehicleId ? 'border-brand-500 bg-brand-50/50 dark:bg-slate-700/60' : 'border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800'}`;
                item.onclick = () => { state.selectedVehicleId = v.id; renderVehicleList(); recenterMap(); };
                item.innerHTML = `
                    <div class="flex items-center gap-2">
                        <span class="w-3 h-3 rounded-full" style="background-color: ${v.color || '#4f46e5'}"></span>
                        <span class="font-bold text-xs">${v.name}</span>
                    </div>
                    <span class="text-[11px] font-mono font-bold text-slate-500">${v.speed ? v.speed.toFixed(1) : '0.0'} km/h</span>
                `;
                container.appendChild(item);

                // Admin List Item
                if (adminContainer) {
                    const adminRow = document.createElement('div');
                    adminRow.className = "py-3 flex items-center justify-between";
                    adminRow.innerHTML = `
                        <div class="flex items-center gap-3">
                            <span class="w-3 h-3 rounded-full" style="background-color: ${v.color || '#4f46e5'}"></span>
                            <div>
                                <div class="font-bold text-sm">${v.name} (${v.id})</div>
                                <div class="text-xs text-slate-400">乗員: ${v.driver || '未設定'}</div>
                            </div>
                        </div>
                        <button onclick="openVehicleModal('${v.id}')" class="px-3 py-1 bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 text-xs font-bold rounded-lg">編集</button>
                    `;
                    adminContainer.appendChild(adminRow);
                }
            });
        }

        // --- Admin Auth & Vehicle Modal ---
        function loginAdmin() {
            const pass = document.getElementById('admin-pass-input').value;
            if (pass === state.adminPassword) {
                state.isAdminLoggedIn = true;
                document.getElementById('admin-auth-card').classList.add('hidden');
                document.getElementById('admin-content').classList.remove('hidden');
                renderVehicleList();
            } else {
                alert("パスワードが正しくありません");
            }
        }

        function openVehicleModal(vehicleId = null) {
            document.getElementById('form-vehicle').reset();
            const deleteBtn = document.getElementById('btn-delete-vehicle');

            if (vehicleId && state.vehicles[vehicleId]) {
                const v = state.vehicles[vehicleId];
                document.getElementById('modal-vehicle-title').textContent = "車両編集";
                document.getElementById('edit-vehicle-original-id').value = v.id;
                document.getElementById('input-vehicle-id').value = v.id;
                document.getElementById('input-vehicle-name').value = v.name;
                document.getElementById('input-vehicle-driver').value = v.driver || '';
                document.getElementById('input-vehicle-color').value = v.color || '#4f46e5';
                deleteBtn.classList.remove('hidden');
            } else {
                document.getElementById('modal-vehicle-title').textContent = "車両追加";
                document.getElementById('edit-vehicle-original-id').value = '';
                document.getElementById('input-vehicle-id').value = `CAR-00${Object.keys(state.vehicles).length + 1}`;
                deleteBtn.classList.add('hidden');
            }
            document.getElementById('modal-vehicle').classList.remove('hidden');
        }

        function closeVehicleModal() {
            document.getElementById('modal-vehicle').classList.add('hidden');
        }

        async function saveVehicle(e) {
            e.preventDefault();
            const origId = document.getElementById('edit-vehicle-original-id').value;
            const id = document.getElementById('input-vehicle-id').value.trim();
            const name = document.getElementById('input-vehicle-name').value.trim();
            const driver = document.getElementById('input-vehicle-driver').value.trim();
            const color = document.getElementById('input-vehicle-color').value;

            if (!id || !name) return;

            if (origId && origId !== id) {
                delete state.vehicles[origId];
            }

            state.vehicles[id] = {
                ...state.vehicles[id],
                id, name, driver, color,
                lat: state.vehicles[id]?.lat || 35.1709,
                lng: state.vehicles[id]?.lng || 136.9076,
                speed: state.vehicles[id]?.speed || 0,
                heading: state.vehicles[id]?.heading || 0,
                online: true,
                lastUpdated: new Date().toISOString()
            };

            saveVehiclesLocal();
            renderVehicleList();
            updateMapMarkers();
            closeVehicleModal();
            await pushCurrentToGitHub();
        }

        async function deleteVehicle() {
            const origId = document.getElementById('edit-vehicle-original-id').value;
            if (origId && state.vehicles[origId]) {
                delete state.vehicles[origId];
                if (state.markers[origId]) {
                    state.map.removeLayer(state.markers[origId]);
                    delete state.markers[origId];
                }
                saveVehiclesLocal();
                renderVehicleList();
                closeVehicleModal();
                await pushCurrentToGitHub();
            }
        }

        async function saveAdminConfig() {
            state.config.owner = document.getElementById('cfg-owner').value.trim();
            state.config.repo = document.getElementById('cfg-repo').value.trim();
            state.config.token = document.getElementById('cfg-token').value.trim();
            localStorage.setItem('fleet_config', JSON.stringify(state.config));

            const newPass = document.getElementById('cfg-admin-pass').value.trim();
            if (newPass) {
                state.adminPassword = newPass;
                // Push new password to config.json
                await pushConfigJsonToGitHub(newPass);
            }

            updateGeneratedUrlCard();
            alert("設定を保存しました");
        }

        async function pushConfigJsonToGitHub(newPassword) {
            const { owner, repo, token } = state.config;
            if (!owner || !repo || !token) return;

            const path = `data/config.json`;
            const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;

            try {
                let sha = "";
                const getRes = await fetch(url, { headers: { 'Authorization': `token ${token}` } });
                if (getRes.ok) {
                    const fileInfo = await getRes.json();
                    sha = fileInfo.sha;
                }

                const contentEncoded = btoa(unescape(encodeURIComponent(JSON.stringify({ adminPassword: newPassword }, null, 2))));
                await fetch(url, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: `Update admin password`, content: contentEncoded, sha: sha || undefined })
                });
            } catch(e){}
        }

        function updateGeneratedUrlCard() {
            const { owner, repo, token } = state.config;
            const card = document.getElementById('url-generator-card');
            const input = document.getElementById('generated-url-input');
            if (owner && repo && token) {
                const baseUrl = window.location.origin + window.location.pathname;
                input.value = `${baseUrl}?token=${token}&user=${owner}&repo=${repo}`;
                card.classList.remove('hidden');
            } else {
                card.classList.add('hidden');
            }
        }

        function copyGeneratedUrl() {
            const input = document.getElementById('generated-url-input');
            input.select();
            navigator.clipboard.writeText(input.value);
            alert("自動設定URLをクリップボードにコピーしました！");
        }

        // --- Transmitter Logic ---
        function updateSendDropdown() {
            const sel = document.getElementById('send-vehicle-select');
            sel.innerHTML = '';
            Object.values(state.vehicles).forEach(v => {
                const opt = document.createElement('option');
                opt.value = v.id;
                opt.textContent = `${v.name} (${v.driver || '乗員なし'})`;
                if (v.id === state.selectedVehicleId) opt.selected = true;
                sel.appendChild(opt);
            });
        }

        function onSendVehicleChange() {
            state.selectedVehicleId = document.getElementById('send-vehicle-select').value;
        }

        function toggleTracking() {
            const btn = document.getElementById('btn-toggle-tracking');
            if (!state.isTracking) {
                if ("geolocation" in navigator) {
                    state.watchPositionId = navigator.geolocation.watchPosition(
                        handlePositionUpdate,
                        (err) => console.warn(err),
                        { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
                    );
                    state.isTracking = true;
                    btn.className = "w-full py-4 rounded-2xl font-bold text-lg text-white shadow-lg transition-all duration-200 flex items-center justify-center gap-2 bg-red-600 hover:bg-red-700 active:scale-95";
                    btn.innerHTML = `<span class="material-symbols-outlined text-2xl">stop_circle</span><span>送信を停止</span>`;
                }
            } else {
                if (state.watchPositionId !== null) navigator.geolocation.clearWatch(state.watchPositionId);
                state.isTracking = false;
                btn.className = "w-full py-4 rounded-2xl font-bold text-lg text-white shadow-lg transition-all duration-200 flex items-center justify-center gap-2 bg-emerald-600 hover:bg-emerald-700 active:scale-95";
                btn.innerHTML = `<span class="material-symbols-outlined text-2xl">sensors</span><span>位置情報の送信を開始</span>`;
            }
        }

        async function handlePositionUpdate(pos) {
            const { latitude, longitude, speed, heading, accuracy } = pos.coords;
            const targetId = state.selectedVehicleId;
            if (!targetId || !state.vehicles[targetId]) return;

            const speedKmH = speed ? (speed * 3.6) : 0;
            const headDeg = heading || 0;

            document.getElementById('mobile-speed').textContent = speedKmH.toFixed(1);
            document.getElementById('mobile-heading').textContent = `${Math.round(headDeg)}°`;
            document.getElementById('mobile-accuracy').textContent = `${Math.round(accuracy)} m`;
            document.getElementById('mobile-last-send').textContent = `最終送信: ${new Date().toLocaleTimeString()}`;

            state.vehicles[targetId] = {
                ...state.vehicles[targetId],
                lat: latitude, lng: longitude, speed: speedKmH, heading: headDeg,
                online: true, lastUpdated: new Date().toISOString()
            };

            saveVehiclesLocal();
            await pushCurrentToGitHub();
            await appendHistoryLogToGitHub(targetId, latitude, longitude, speedKmH, headDeg);
        }

        function handleTimelineChange(v) {
            document.getElementById('timeline-time').textContent = v === '100' ? 'ライブ表示中' : `履歴 (${v}%)`;
        }
        function togglePlayback() {}
        function resetTimeline() {
            document.getElementById('timeline-slider').value = 100;
            handleTimelineChange('100');
        }
    </script>
</body>
</html>
